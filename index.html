<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>책결 — 프리미엄 독서</title>
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="책결">
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="touchIcon">
<style>
:root{--bg:#0f1116;--panel:#161920;--ink:#eceae4;--sub:#9aa0a6;--line:#272b32;--accent:#c8a27a;--accent2:#a97f56;--reader-bg:#121419;--reader-ink:#d9d6cf;--shadow:0 20px 55px rgba(0,0,0,.45)}
[data-theme="light"]{--bg:#f7f5f0;--panel:#fffefb;--ink:#181a20;--sub:#6f7480;--line:#e8e3d9;--accent:#8a6b4d;--accent2:#b08968;--reader-bg:#fcfaf5;--reader-ink:#22252c;--shadow:0 20px 55px rgba(24,20,14,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit}
.view{display:none;min-height:100dvh}
.view.active{display:block}
#home,#library{width:100%;max-width:560px;margin:0 auto}

/* ---- HOME ---- */
#home{display:flex;flex-direction:column;min-height:100dvh;background:
 radial-gradient(120% 70% at 50% -10%,rgba(200,162,122,.16),transparent 60%),
 radial-gradient(90% 50% at 50% 110%,rgba(169,127,86,.10),transparent),var(--bg)}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 30px) 28px 10px;text-align:center}
.hero-art{width:min(300px,74vw);margin-bottom:6px;filter:drop-shadow(0 24px 45px rgba(0,0,0,.28))}
.hero h1{margin:18px 0 0;font-size:44px;font-weight:800;letter-spacing:-.05em}
.hero .tag{margin:12px 0 0;color:var(--sub);font-size:13.5px;letter-spacing:.02em;line-height:1.7}
.hero .rule{width:38px;height:2px;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:22px auto 0;opacity:.85}
.home-bottom{padding:10px 24px calc(env(safe-area-inset-bottom) + 30px)}
.resume{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:20px;padding:15px 16px;margin-bottom:16px;backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.resume .rc{width:42px;height:56px;border-radius:9px;background:linear-gradient(150deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:0 0 auto}
.resume-main{flex:1;min-width:0}
.resume-main small{display:block;color:var(--accent);font-size:10.5px;font-weight:750;letter-spacing:.16em;margin-bottom:4px}
.resume-main b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume-main span{display:block;color:var(--sub);font-size:12px;margin-top:3px}
.resume .go{color:var(--sub);font-size:18px}
.quick{display:flex;justify-content:center;gap:26px}
.quick button{display:grid;justify-items:center;gap:9px;width:82px}
.quick .qi{width:62px;height:62px;border-radius:22px;display:grid;place-items:center;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);box-shadow:0 12px 28px rgba(0,0,0,.14);backdrop-filter:blur(14px);transition:transform .18s}
.quick button:active .qi{transform:scale(.94)}
.quick small{color:var(--sub);font-size:12px;font-weight:650;letter-spacing:.02em}

/* ---- LIBRARY ---- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 15px) 18px 15px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.topbar h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;flex:1}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:0 0 auto}
.tabs{display:flex;gap:8px;padding:16px 18px 6px}
.tab{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--sub);font-size:13.5px;font-weight:650}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{padding:14px 18px calc(env(safe-area-inset-bottom) + 40px);display:grid;gap:10px;width:100%}
.book{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 8px 22px rgba(0,0,0,.06);width:100%;min-width:0;overflow:hidden}
.cover{width:48px;height:66px;border-radius:10px;background:linear-gradient(150deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:0 0 auto}
.book-main{flex:1 1 auto;min-width:0;overflow:hidden}
.book-title{font-weight:700;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;word-break:keep-all}
.book-meta{color:var(--sub);font-size:12px;margin-top:5px}
.bar{height:3px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.empty{text-align:center;color:var(--sub);padding:76px 24px;font-size:14px;line-height:1.8}

/* ---- READER ---- */
#reader{background:var(--reader-bg);color:var(--reader-ink)}
.reader-scroll{height:100dvh;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 88px) 24px calc(env(safe-area-inset-bottom) + 132px)}
.article{max-width:660px;margin:0 auto}
.doc-title{font-size:clamp(29px,7vw,41px);font-weight:800;letter-spacing:-.045em;line-height:1.12;margin:0;overflow-wrap:anywhere}
.doc-rule{width:44px;height:2px;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:24px 0 52px}
.chapter{margin:88px 0 38px;padding-top:32px;border-top:1px solid color-mix(in srgb,var(--reader-ink) 10%,transparent)}
.chapter small{display:block;color:var(--accent);font-weight:750;letter-spacing:.2em;font-size:10.5px;margin-bottom:10px}
.chapter h2{margin:0;font-size:clamp(23px,5.6vw,31px);font-weight:800;letter-spacing:-.035em;line-height:1.18;overflow-wrap:anywhere}
p{margin:0 0 1.4em;line-height:var(--lh,1.9);font-size:var(--fs,18px);letter-spacing:var(--ls,0em);word-break:keep-all;text-wrap:pretty}
p.dlg{margin:0 0 1.4em;padding-left:16px;border-left:2px solid color-mix(in srgb,var(--accent) 55%,transparent);color:color-mix(in srgb,var(--reader-ink) 84%,var(--accent));font-weight:500}
.fab-wrap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:40;display:flex;justify-content:center;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s}
.fab-wrap.hidden{transform:translateY(135%);opacity:0}
.fab{display:flex;gap:3px;padding:7px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);backdrop-filter:blur(22px)}
.fab button{width:47px;height:47px;border-radius:999px;display:grid;place-items:center}
.fab button:active{background:var(--line)}
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(3px)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:28px 28px 0 0;padding:14px 22px calc(env(safe-area-inset-bottom) + 28px);max-height:80dvh;overflow:auto;box-shadow:0 -22px 65px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 20px}
.sheet-head h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.control{display:grid;gap:9px;margin-bottom:20px}
.control label{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.06em}
.control input[type=range]{width:100%;accent-color:var(--accent)}
.control select{width:100%;padding:13px 15px;border-radius:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}
.chip{flex:1;padding:12px;border-radius:15px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toc-item{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.toc-item small{display:block;color:var(--sub);font-size:11px;margin-top:4px}
textarea{width:100%;min-height:230px;border-radius:18px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:16px;resize:vertical;line-height:1.7}
.primary{width:100%;margin-top:16px;padding:16px;border-radius:17px;background:var(--ink);color:var(--bg);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 19px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;z-index:90;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body data-theme="dark">

<section id="home" class="view active">
  <div class="hero">
    <svg class="hero-art" viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="책결 일러스트">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4ead8"/><stop offset="1" stop-color="#e6d6bd"/></linearGradient>
        <linearGradient id="th" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c8a27a"/><stop offset="1" stop-color="#a97f56"/></linearGradient>
        <radialGradient id="glow" cx=".5" cy=".4" r=".65"><stop stop-color="#c8a27a" stop-opacity=".28"/><stop offset="1" stop-color="#c8a27a" stop-opacity="0"/></radialGradient>
      </defs>
      <circle cx="160" cy="112" r="118" fill="url(#glow)"/>
      <circle cx="52" cy="46" r="1.8" fill="#c8a27a" opacity=".8"/><circle cx="276" cy="38" r="1.4" fill="#c8a27a" opacity=".6"/>
      <circle cx="292" cy="96" r="1.7" fill="#c8a27a" opacity=".7"/><circle cx="30" cy="120" r="1.3" fill="#c8a27a" opacity=".55"/>
      <circle cx="248" cy="196" r="1.5" fill="#c8a27a" opacity=".5"/><circle cx="70" cy="200" r="1.6" fill="#c8a27a" opacity=".6"/>
      <path d="M160 74c-24-14-52-18-78-12v104c26-6 54-2 78 12V74Z" fill="url(#pg)"/>
      <path d="M160 74c24-14 52-18 78-12v104c-26-6-54-2-78 12V74Z" fill="#fbf4e6"/>
      <path d="M160 74v104" stroke="#b39572" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M96 96h44M96 116h38M96 136h44M180 96h44M186 116h38M180 136h44" stroke="#b8a184" stroke-width="2.2" stroke-linecap="round" opacity=".65"/>
      <path d="M82 62c30-8 60-3 78 12 18-15 48-20 78-12v116c-30-8-60-3-78 12-18-15-48-20-78-12V62Z" stroke="#8a6b4d" stroke-width="3" stroke-linejoin="round"/>
      <path d="M160 150c-14-22 8-38 2-54-5-14 8-24 20-18" stroke="url(#th)" stroke-width="4" stroke-linecap="round"/>
      <path d="M160 150c16-18-4-34 6-48 8-12-2-24-14-22" stroke="url(#th)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="168" cy="78" r="7" fill="none" stroke="url(#th)" stroke-width="4"/>
      <circle cx="160" cy="150" r="5" fill="#c8a27a"/>
    </svg>
    <h1>책결</h1>
    <div class="rule"></div>
    <p class="tag">읽던 페이지가 이어지고,<br>책들이 조용히 하나로 이어지는 서재</p>
  </div>
  <div class="home-bottom">
    <button class="resume" id="resumeCard" hidden onclick="resumeLast()">
      <div class="rc" id="resumeInitial">결</div>
      <div class="resume-main"><small>이어 읽기</small><b id="resumeTitle"></b><span id="resumeMeta"></span></div>
      <div class="go">→</div>
    </button>
    <div class="quick">
      <button onclick="showView('library')"><div class="qi">📚</div><small>서재</small></button>
      <button onclick="openPaste()"><div class="qi">📝</div><small>붙여넣기</small></button>
      <button onclick="document.getElementById('fileInput').click()"><div class="qi">📂</div><small>파일 열기</small></button>
    </div>
  </div>
  <input id="fileInput" type="file" accept=".txt,.docx,.pdf,.epub,.md,.markdown,.html,.htm,text/plain,application/pdf,application/epub+zip" style="display:none">
</section>

<section id="library" class="view">
  <div class="topbar"><button class="icon-btn" onclick="showView('home')">←</button><h2>서재</h2><button class="icon-btn" onclick="document.getElementById('fileInput').click()">＋</button></div>
  <div class="tabs"><button class="tab on" id="tabReading" onclick="setTab('reading')">읽고 있는 책</button><button class="tab" id="tabFinished" onclick="setTab('finished')">다 읽은 책</button></div>
  <div class="list" id="bookList"></div>
</section>

<section id="reader" class="view">
  <div class="reader-scroll" id="readerScroll"><article class="article" id="article"></article></div>
  <div class="fab-wrap" id="fabWrap"><div class="fab">
    <button title="서재" onclick="closeReader()">📚</button><button title="목차" onclick="openSheet('tocSheet')">☰</button><button title="본문 설정" onclick="openSheet('typeSheet')">Aa</button><button title="음성 읽기" onclick="openSheet('ttsSheet')">🔊</button><button title="책갈피" onclick="addBookmark()">🔖</button>
  </div></div>
</section>

<div class="sheet" id="typeSheet"><div class="sheet-bg" onclick="closeSheets()"></div><div class="sheet-card">
  <div class="sheet-head"><h3>본문 설정</h3><button class="icon-btn" onclick="closeSheets()">✕</button></div>
  <div class="control"><label>글꼴</label><select id="fontSelect" onchange="applyType()"><option value="'Noto Serif KR','Nanum Myeongjo',serif">명조 — 소설·문학</option><option value="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">산세리프 — 현대·깔끔</option><option value="Georgia,'Nanum Myeongjo',serif">Georgia — 클래식</option><option value="ui-monospace,SFMono-Regular,Menlo,monospace">모노 — 집중 독서</option></select></div>
  <div class="control"><label>글자 크기 · <span id="fsVal">18px</span></label><input type="range" id="fsRange" min="14" max="28" step="1" value="18" oninput="applyType()"></div>
  <div class="control"><label>자간 · <span id="lsVal">0.00em</span></label><input type="range" id="lsRange" min="-0.05" max="0.18" step="0.01" value="0" oninput="applyType()"></div>
  <div class="control"><label>행간 · <span id="lhVal">1.90</span></label><input type="range" id="lhRange" min="1.45" max="2.35" step="0.05" value="1.9" oninput="applyType()"></div>
  <div class="row"><button class="chip on" id="lightChip" onclick="setTheme('light')">라이트</button><button class="chip" id="darkChip" onclick="setTheme('dark')">나이트</button><button class="chip" id="sepiaChip" onclick="setTheme('sepia')">세피아</button></div>
</div></div>
<div class="sheet" id="tocSheet"><div class="sheet-bg" onclick="closeSheets()"></div><div class="sheet-card">
  <div class="sheet-head"><h3>목차</h3><button class="icon-btn" onclick="closeSheets()">✕</button></div><div id="tocList"></div>
  <button class="primary" onclick="addManualToc()">현재 위치를 목차로 추가</button>
</div></div>
<div class="sheet" id="ttsSheet"><div class="sheet-bg" onclick="closeSheets()"></div><div class="sheet-card">
  <div class="sheet-head"><h3>시스템 음성 읽기</h3><button class="icon-btn" onclick="closeSheets()">✕</button></div>
  <p style="color:var(--sub);font-size:13px;margin-top:0">기기에 설치된 시스템 TTS 음성을 사용합니다.</p>
  <div class="control"><label>읽기 속도 · <span id="rateVal">1.00x</span></label><input type="range" id="rateRange" min="0.6" max="2" step="0.05" value="1" oninput="document.getElementById('rateVal').textContent=(+this.value).toFixed(2)+'x'"></div>
  <div class="row"><button class="chip" onclick="startTTS()">▶ 재생</button><button class="chip" onclick="speechSynthesis.pause()">⏸ 일시정지</button><button class="chip" onclick="speechSynthesis.resume()">⏵ 계속</button><button class="chip" onclick="stopTTS()">⏹ 정지</button></div>
</div></div>
<div class="sheet" id="pasteSheet"><div class="sheet-bg" onclick="closeSheets()"></div><div class="sheet-card">
  <div class="sheet-head"><h3>TXT 붙여넣기</h3><button class="icon-btn" onclick="closeSheets()">✕</button></div>
  <textarea id="pasteArea" placeholder="소설 본문이나 원고를 붙여넣으세요."></textarea>
  <button class="primary" onclick="savePasted()">서재에 추가하고 읽기</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
let books=[],current=null,tab='reading',lastY=0,saveTimer=null;
const icon='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#171a20"/><rect x="118" y="112" width="276" height="288" rx="26" fill="#f6f2ea"/><rect x="118" y="112" width="42" height="288" fill="#8a6b4d"/><rect x="196" y="176" width="150" height="16" rx="8" fill="#2a2d34"/><rect x="196" y="216" width="118" height="12" rx="6" fill="#8a6b4d"/><rect x="196" y="252" width="150" height="12" rx="6" fill="#c9c2b4"/><rect x="196" y="288" width="132" height="12" rx="6" fill="#c9c2b4"/></svg>`);
document.getElementById('touchIcon').href=icon;
const manifest={name:'책결 — 프리미엄 독서',short_name:'책결',start_url:'.',display:'standalone',background_color:'#0f1116',theme_color:'#0f1116',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any'},{src:icon,sizes:'192x192',type:'image/svg+xml',purpose:'any'}]};
document.getElementById('manifestLink').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='library')renderLibrary();if(id==='home')renderResume();}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}
function openSheet(id){closeSheets();document.getElementById(id).classList.add('open');}
function openPaste(){openSheet('pasteSheet');}
function closeSheets(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));}
function db(){return new Promise((res,rej)=>{const r=indexedDB.open('chaekgyeol-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('books',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function saveBook(b){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('books','readwrite');tx.objectStore('books').put(b);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function loadBooks(){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('books','readonly');const q=tx.objectStore('books').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}
async function removeBook(id){const d=await db();return new Promise(res=>{const tx=d.transaction('books','readwrite');tx.objectStore('books').delete(id);tx.oncomplete=res;});}
async function renderResume(){
  books=await loadBooks();
  const last=books.filter(b=>!b.finished&&(b.progress||0)>0.005).sort((a,b)=>(b.addedAt)-(a.addedAt))[0];
  const card=document.getElementById('resumeCard');
  if(!last){card.hidden=true;return;}
  card.hidden=false;
  document.getElementById('resumeInitial').textContent=(last.title||'책')[0];
  document.getElementById('resumeTitle').textContent=last.title;
  document.getElementById('resumeMeta').textContent=`${last.format||'TXT'} · ${Math.round((last.progress||0)*100)}%까지 읽음`;
  card.onclick=()=>openBook(last.id);
}
function resumeLast(){const c=document.getElementById('resumeCard');if(!c.hidden)c.click();}
async function decodeBytes(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){}try{return new TextDecoder('euc-kr').decode(buf);}catch(e){}try{return new TextDecoder('windows-1252').decode(buf);}catch(e){}return new TextDecoder().decode(buf);}
function stripHtml(s){const doc=new DOMParser().parseFromString(s,'text/html');doc.querySelectorAll('script,style,nav,header,footer').forEach(n=>n.remove());doc.querySelectorAll('h1,h2,h3,h4').forEach(h=>h.textContent='\n\n## '+h.textContent.trim()+'\n\n');doc.querySelectorAll('p,div,br,li').forEach(n=>n.insertAdjacentText('afterend','\n'));return doc.body.textContent.replace(/\r/g,'').replace(/\n{3,}/g,'\n\n').trim();}
async function unzip(buf){const dv=new DataView(buf);let end=-1;for(let i=buf.byteLength-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){end=i;break;}}if(end<0)throw new Error('ZIP 구조를 읽을 수 없습니다.');const n=dv.getUint16(end+10,true);let p=dv.getUint32(end+16,true);const files={};const dec=new TextDecoder();for(let i=0;i<n;i++){const method=dv.getUint16(p+10,true),size=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);const name=dec.decode(new Uint8Array(buf,p+46,nl));const lnl=dv.getUint16(lho+26,true),lel=dv.getUint16(lho+28,true),start=lho+30+lnl+lel;const raw=new Uint8Array(buf,start,size);let out;if(method===0)out=raw;else out=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());files[name]=out;p+=46+nl+el+cl;}return files;}
function xmlText(s){return s.replace(/<w:p[ >]/g,'\n\n<w:p ').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\n{3,}/g,'\n\n').trim();}
async function parseFile(file){const ext=(file.name.split('.').pop()||'').toLowerCase();const buf=await file.arrayBuffer();if(['txt','md','markdown'].includes(ext))return{text:await decodeBytes(buf),format:ext.toUpperCase()};if(['html','htm'].includes(ext))return{text:stripHtml(await decodeBytes(buf)),format:'HTML'};if(ext==='docx'){const z=await unzip(buf);const key=Object.keys(z).find(k=>k==='word/document.xml');if(!key)throw new Error('DOCX 본문을 찾지 못했습니다.');return{text:xmlText(new TextDecoder().decode(z[key])),format:'DOCX'};}if(ext==='epub'){const z=await unzip(buf);const container=new TextDecoder().decode(z['META-INF/container.xml']);const opfPath=(container.match(/full-path="([^"]+)"/)||[])[1];if(!opfPath)throw new Error('EPUB 구조를 찾지 못했습니다.');const base=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';const opf=new TextDecoder().decode(z[opfPath]);const items={};opf.replace(/<item\b[^>]*>/g,m=>{const id=(m.match(/id="([^"]+)"/)||[])[1],href=(m.match(/href="([^"]+)"/)||[])[1];if(id&&href)items[id]=href;return m;});const order=[...opf.matchAll(/<itemref\b[^>]*idref="([^"]+)"/g)].map(m=>items[m[1]]).filter(Boolean);const files=order.length?order:Object.keys(z).filter(k=>/\.(x?html|htm)$/i.test(k));let text='';for(const f of files){const path=base+f;if(z[path])text+='\n\n'+stripHtml(new TextDecoder().decode(z[path]));}return{text:text.trim(),format:'EPUB'};}if(ext==='pdf')return await parsePdf(buf);throw new Error('지원하지 않는 파일 형식입니다.');}
async function parsePdf(buf){try{if(!window.pdfjsLib){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}const pdf=await pdfjsLib.getDocument({data:buf}).promise;let out='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const c=await page.getTextContent();const rows=[];for(const it of c.items){if(!it.str||!it.str.trim())continue;const y=it.transform[5],x=it.transform[4],h=it.height||12;const last=rows[rows.length-1];if(last&&Math.abs(last.y-y)<3.2){last.parts.push({x,str:it.str});last.h=Math.max(last.h,h);}else rows.push({y,h,parts:[{x,str:it.str}]});}let prev=null;for(const r of rows){r.parts.sort((a,b)=>a.x-b.x);const line=r.parts.map(p=>p.str).join(' ').replace(/\s+/g,' ').trim();if(!line)continue;if(prev!==null&&(prev.y-r.y)>r.h*1.62)out+='\n\n';else if(prev!==null)out+='\n';out+=line;prev=r;}out+='\n\n';}return{text:out.replace(/\n{3,}/g,'\n\n').trim(),format:'PDF'};}catch(e){throw new Error('PDF 텍스트 추출에는 최초 1회 인터넷 연결이 필요합니다.');}}
function detectTOC(text){const lines=text.split(/\n/);const toc=[];let count=0;const patterns=[/^#{1,3}\s+(.+)/,/^\s*(프롤로그|서문|머리말|서장|에필로그|후기|맺음말)\s*$/,/^\s*(제\s*\d+\s*장|[0-9]+\s*장)\s*(.*)$/,/^\s*Chapter\s+\d+\s*[-.:]?\s*(.*)$/i,/^\s*\d+\.\s+([^\d].{0,55})$/];for(let i=0;i<lines.length;i++){const line=lines[i].trim();if(!line||line.length>72)continue;for(const re of patterns){const m=line.match(re);if(m){const title=(m[1]||m[0]).trim();if(title){toc.push({title,index:text.indexOf(line),line});count++;}break;}}if(count>320)break;}return toc.length>1?toc:[];}
function addManualToc(){if(!current)return;const pos=current.text.indexOf(visibleFirstText());const title=prompt('목차 제목을 입력하세요','책갈피 '+(current.toc.length+1));if(!title)return;current.toc.push({title,index:Math.max(0,pos),manual:true});saveBook(current);renderTOC();toast('목차에 추가했습니다');}
function visibleFirstText(){const ps=[...document.querySelectorAll('#article p, #article .chapter h2')];for(const p of ps){const r=p.getBoundingClientRect();if(r.bottom>100)return p.textContent.trim().slice(0,90);}return'';}
function setTab(t){tab=t;document.getElementById('tabReading').classList.toggle('on',t==='reading');document.getElementById('tabFinished').classList.toggle('on',t==='finished');renderLibrary();}
async function renderLibrary(){books=await loadBooks();const list=document.getElementById('bookList');list.innerHTML='';const filtered=books.filter(b=>tab==='reading'?!b.finished:b.finished).sort((a,b)=>b.addedAt-a.addedAt);if(!filtered.length){list.innerHTML=`<div class="empty">${tab==='reading'?'아직 읽고 있는 책이 없습니다.<br>홈 화면에서 파일을 열거나 TXT를 붙여넣어 보세요.':'다 읽은 책이 없습니다.<br>책의 끝까지 읽으면 이곳에 기록됩니다.'}</div>`;return;}filtered.forEach(b=>{const pct=Math.round((b.progress||0)*100);const el=document.createElement('div');el.className='book';el.innerHTML=`<div class="cover"></div><div class="book-main"><div class="book-title"></div><div class="book-meta"></div><div class="bar"><i></i></div></div><button class="icon-btn">🗑</button>`;el.querySelector('.cover').textContent=(b.title||'책')[0];el.querySelector('.book-title').textContent=b.title;el.querySelector('.book-meta').textContent=`${b.format||'TXT'} · ${pct}%${b.finished?' · 완독':''}`;el.querySelector('.bar i').style.width=pct+'%';el.querySelector('.book-main').onclick=()=>openBook(b.id);el.querySelector('.icon-btn').onclick=async e=>{e.stopPropagation();if(confirm(`『${b.title}』을 서재에서 삭제할까요?`)){await removeBook(b.id);renderLibrary();toast('삭제했습니다');}};list.appendChild(el);});}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function isDialogue(line){const t=line.trim();return /^[“"'‘「『]/.test(t)||/[”"'’」』]$/.test(t);}
function renderText(text,title){const clean=text.replace(/\r\n?/g,'\n').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();const blocks=clean.split(/\n\s*\n/);let html=`<h1 class="doc-title">${esc(title)}</h1><div class="doc-rule"></div>`;let open=false;const chapterRe=/^(제\s*\d+\s*장|[0-9]+\s*장|프롤로그|서문|머리말|서장|에필로그|후기|맺음말|Chapter\s+\d+).{0,60}$/i;for(const block of blocks){for(const raw of block.split('\n')){const line=raw.trim();if(!line)continue;const md=line.match(/^#{1,3}\s+(.+)/);if(md){if(open)html+='</div>';html+=`<div class="chapter"><small>CHAPTER</small><h2>${esc(md[1])}</h2>`;open=true;continue;}if(!open&&chapterRe.test(line)&&line.length<72){html+=`<div class="chapter"><small>CHAPTER</small><h2>${esc(line)}</h2>`;open=true;continue;}if(open){html+='</div>';open=false;}if(isDialogue(line))html+=`<p class="dlg">${esc(line)}</p>`;else html+=`<p>${esc(line)}</p>`;}}if(open)html+='</div>';document.getElementById('article').innerHTML=html;}
async function openBook(id){books=await loadBooks();current=books.find(b=>b.id===id);if(!current)return;renderText(current.text,current.title);applyType();renderTOC();showView('reader');requestAnimationFrame(()=>{document.getElementById('readerScroll').scrollTop=(current.progress||0)*document.getElementById('readerScroll').scrollHeight;});}
function closeReader(){saveProgressNow();stopTTS();showView('library');}
async function addBook(title,text,format){const b={id:'b'+Date.now()+Math.random().toString(36).slice(2,7),title,format,addedAt:Date.now(),text,progress:0,finished:false,toc:detectTOC(text)};await saveBook(b);await openBook(b.id);document.getElementById('readerScroll').scrollTop=0;b.progress=0;b.finished=false;await saveBook(b);toast('서재에 추가했습니다');}
async function savePasted(){const text=document.getElementById('pasteArea').value.trim();if(!text)return toast('본문을 붙여넣으세요');const title=text.split('\n')[0].slice(0,42)||'붙여넣은 글';closeSheets();document.getElementById('pasteArea').value='';await addBook(title,text,'TXT');}
document.getElementById('fileInput').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;toast('파일을 준비하는 중…');try{const r=await parseFile(file);await addBook(file.name.replace(/\.[^.]+$/,''),r.text,r.format);}catch(err){alert(err.message);}});
function applyType(){const fs=document.getElementById('fsRange').value,ls=document.getElementById('lsRange').value,lh=document.getElementById('lhRange').value,font=document.getElementById('fontSelect').value;document.getElementById('fsVal').textContent=fs+'px';document.getElementById('lsVal').textContent=(+ls).toFixed(2)+'em';document.getElementById('lhVal').textContent=(+lh).toFixed(2);const a=document.getElementById('article');a.style.setProperty('--fs',fs+'px');a.style.setProperty('--ls',ls+'em');a.style.setProperty('--lh',lh);a.style.fontFamily=font;if(current){current.settings={fs,ls,lh,font};saveBook(current);}}
function setTheme(t){if(t==='sepia'){document.body.removeAttribute('data-theme');document.body.style.setProperty('--reader-bg','#f4ead8');document.body.style.setProperty('--reader-ink','#3b3227');}else{document.body.style.removeProperty('--reader-bg');document.body.style.removeProperty('--reader-ink');document.body.dataset.theme=t;}document.getElementById('lightChip').classList.toggle('on',t==='light');document.getElementById('darkChip').classList.toggle('on',t==='dark');document.getElementById('sepiaChip').classList.toggle('on',t==='sepia');if(current){current.theme=t;saveBook(current);}}
function renderTOC(){const box=document.getElementById('tocList');box.innerHTML='';if(!current.toc.length){box.innerHTML='<div class="empty">문서에서 목차를 찾지 못했습니다.<br>현재 위치를 목차로 추가할 수 있습니다.</div>';return;}current.toc.forEach(t=>{const b=document.createElement('button');b.className='toc-item';b.innerHTML=`${esc(t.title)}<small>${t.manual?'직접 추가한 목차':'문서에서 찾은 목차'}</small>`;b.onclick=()=>{const s=document.getElementById('readerScroll');s.scrollTop=(t.index/current.text.length)*s.scrollHeight;closeSheets();};box.appendChild(b);});}
function addBookmark(){if(!current)return;const pos=current.text.indexOf(visibleFirstText());current.toc.push({title:'🔖 '+(visibleFirstText().slice(0,26)||'책갈피'),index:Math.max(0,pos),manual:true});saveBook(current);toast('책갈피를 추가했습니다');}
const scroll=document.getElementById('readerScroll');scroll.addEventListener('scroll',()=>{const y=scroll.scrollTop,max=scroll.scrollHeight-scroll.clientHeight,pct=max>0?y/max:0;if(current){current.progress=pct;current.finished=pct>0.985;if(current.finished)toast('완독했습니다');}clearTimeout(saveTimer);saveTimer=setTimeout(saveProgressNow,450);const fab=document.getElementById('fabWrap');if(y>lastY+8&&y>90)fab.classList.add('hidden');else if(y<lastY-8)fab.classList.remove('hidden');lastY=y;},{passive:true});
async function saveProgressNow(){if(current)await saveBook(current);}
let ttsQueue=[],ttsIndex=0;
function startTTS(){stopTTS();if(!current)return;const start=Math.max(0,current.text.indexOf(visibleFirstText()));const chunks=current.text.slice(start).match(/[^.!?\n…]+[.!?\n…]*\s*/g)||[current.text];ttsQueue=[];let buf='';for(const c of chunks){buf+=c;if(buf.length>220){ttsQueue.push(buf.trim());buf='';}}if(buf.trim())ttsQueue.push(buf.trim());ttsIndex=0;speakNext();}
function speakNext(){if(ttsIndex>=ttsQueue.length)return;const u=new SpeechSynthesisUtterance(ttsQueue[ttsIndex++]);u.lang='ko-KR';u.rate=+document.getElementById('rateRange').value;u.onend=speakNext;u.onerror=speakNext;speechSynthesis.speak(u);}
function stopTTS(){speechSynthesis.cancel();ttsQueue=[];ttsIndex=0;}
(async()=>{books=await loadBooks();renderResume();})();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets();});
</script>
